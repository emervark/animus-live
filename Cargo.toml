[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emervark/animus-live"
rust-version = "1.85"

[workspace.dependencies]
# --- Bevy-free core ---
# glam 0.32 is what Bevy 0.19.1 resolves (glam v0.32.1). Keep these two in
# lockstep: bumping Bevy's version requires re-checking this pin, and vice
# versa, or animus-core will link a second copy of glam.
glam        = { version = "0.32", features = ["serde"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["preserve_order"] }
indexmap    = { version = "2", features = ["serde"] }
thiserror   = "2"
tracing     = "0.1"

# --- geometry ---
spade       = "2.15"
i_overlay   = "8.1"
imageproc   = { version = "0.27", default-features = false }
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- bevy half ---
# Exact-pinned: every Bevy bump requires re-checking the glam pin above and
# the wgpu-hal/egui set. Default features for now -- the application needs
# most of them anyway, and guessing at a trimmed feature list is a worse
# first move than measuring later.
bevy        = "=0.19.1"
# Exactly one `egui` may exist in the graph (spec §2.1). These four versions
# are a set: bumping any one of them requires re-checking the others.
bevy_egui   = "=0.40"
egui        = "=0.34"
egui_dock   = { version = "=0.19.1", features = ["serde"] }

# --- project io ---
sha2        = "0.10"
tempfile    = "3"

# --- testing ---
proptest    = "1"
insta       = { version = "1", features = ["json"] }
approx      = "0.5"

# --- internal ---
animus-core    = { path = "crates/animus-core" }
animus-project = { path = "crates/animus-project" }
animus-runtime = { path = "crates/animus-runtime" }
animus-editor  = { path = "crates/animus-editor" }
animus-output  = { path = "crates/animus-output" }
animus-app     = { path = "crates/animus-app" }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"       # load-bearing: per-subsystem catch_unwind depends on it

[profile.dist]
inherits = "release"
strip = "none"
debug = 1
